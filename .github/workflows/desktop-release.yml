name: desktop-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact_name: sing-box-desktop-windows-amd64.exe
          - os: macos-latest
            platform: darwin/universal
            artifact_name: sing-box-desktop-darwin-universal
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact_name: sing-box-desktop-linux-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout sing-controller
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: controller/web/pnpm-lock.yaml

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build WebUI
        run: |
          cd controller/web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Sync WebUI Dist to Desktop
        shell: bash
        run: |
          mkdir -p desktop/frontend/dist
          cp -r controller/web/dist/* desktop/frontend/dist/

      - name: Build Desktop Application (Wails)
        shell: bash
        run: |
          cd desktop
          wails build -platform ${{ matrix.platform }} -s -o ${{ matrix.artifact_name }}

      - name: Package Desktop Artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dist = "dist/desktop-windows"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item "desktop/build/bin/*" $dist -Recurse -Force
          Compress-Archive -Path "$dist\*" -DestinationPath "sing-box-desktop-windows-amd64.zip" -Force

      - name: Upload Windows Asset
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: sing-box-desktop-windows-amd64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Desktop Artifact (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd desktop/build/bin
          tar -czf ../../../sing-box-desktop-${{ runner.os }}-amd64.tar.gz *

      - name: Upload macOS / Linux Asset
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: sing-box-desktop-${{ runner.os }}-amd64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
